[package]
name = "strand"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
semver = "1"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"
colored = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
urlencoding = "2"
indicatif = "0.17"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"
